name: Trigger auto deployment for n8b-git

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/n8b-git-AutoDeployTrigger-e54a2398-562b-4e7a-82c0-28fa317368d5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.N8BGIT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.N8BGIT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.N8BGIT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.N8BGIT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.N8BGIT_REGISTRY_PASSWORD }}
          containerAppName: n8b-git
          resourceGroup: advantisflow-private
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


